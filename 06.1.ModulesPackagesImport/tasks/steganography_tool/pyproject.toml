[build-system]
requires = ["setuptools >= 61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steganography-tool"
version = "0.0.1"
description = "LSB steganography tool"
authors = [{email = "me@yandex.shad"}]
requires-python = ">=3.9"
dependencies = [
    "Pillow",
    "click",
    "numpy",
]

[project.scripts]
steganography-tool = "steganography_tool.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
steganography_tool = ["*.png"]
